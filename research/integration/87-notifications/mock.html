<script>
const v=new URLSearchParams(location.search).get('v')||'1';
let SND='<span class="snd" title="Звук">🔊</span>';
const Z={none:'',
nosound:'<div class="state warn"><span>🔇</span><span class="t"><b>Звук не включён</b>: браузер молчит, пока на странице ничего не нажато. Нажмите — прозвучит проверочный сигнал.</span><span class="btn p">Включить звук</span></div>',
muted:'<div class="state info"><span>🔉</span><span class="t"><b>Только важное до 14:16</b>: звучат «Критический» и переданное вам, остальное молчит</span><span class="btn">Вернуть</span></div>',
one:'<div class="state info"><span>🛠</span><span class="t">Идут плановые работы: <b>Все камеры</b> — «Ремонт системы», до 13:30. Тревоги с этих устройств не создаются.</span></div>',
more:'<div class="state crit"><span>⚠</span><span class="t"><b>Нет связи с агентом</b> «Склад-2»: события с 12 устройств не приходят 4 мин</span><span class="all">и ещё 2</span></div>'};
function topBar(z){return '<div class="top"><div class="logo"><div class="hex"></div><div><b>Axxon Incident Manager</b><small>AxxonSoft / ITV</small></div><div class="menu">≡</div></div><div class="z1">'+z+'</div><div class="right">'+SND+'?&nbsp;<u>Конфигуратор</u><div><b>Администратор</b><br><small>cloud-admin</small></div><span class="busy">Занят</span><span>14:11</span></div></div>'}
// справочник приоритетов (поставка): название, цвет; короткая подпись — первые буквы, пока различимы
const PRI=[['Критический','red','К'],['Высокий','amber','В'],['Средний','blue','С'],['Низкий','grey','Н']];
const COL={red:'#d32f2f',amber:'#d97a00',blue:'#1f6fe5',grey:'#9aa0a6'};
const TXT={red:'#a11',amber:'#8a4b00',blue:'#0f4fa8',grey:'#555'};
// состояния — queueFilters машины; выбрано всегда одно; «Завершённые» и «Все» без числа (counted:false)
function states(on,n,nw){const S=[['open','Открытые',n.open],['inbox','Мне на принятие',n.inbox,1],['mine','Мои',n.mine],['foreign','Чужие',n.foreign],['done','Завершённые'],['all','Все, с завершёнными']];
 const cur=S.find(s=>s[0]===on);const mark=k=>nw&&nw[k]?'<em class="nw">+'+nw[k]+'</em>':'';
 return '<div class="grp2 sts"><span class="dd stdd">'+cur[1]+(cur[2]!=null?' '+cur[2]:'')+mark(on)+' ▾</span>'+S.map(s=>'<span class="st'+(on===s[0]?' on':'')+(s[3]&&s[2]>0?' hot':'')+(s[3]?' keep':'')+(s[0]==='foreign'||s[2]==null?' x':'')+'">'+s[1]+(s[2]!=null?'<b>'+s[2]+'</b>':'')+mark(s[0])+'</span>').join('')+'<span class="st more">Ещё ▾</span></div>'}
// приоритеты — можно выбрать несколько; выбранный — рамка его цвета и галочка
function prios(sel,c,fold,nw){sel=sel||[];return '<div class="grp2">'+PRI.map((p,i)=>{const f=fold&&fold.includes(i)&&c[i]>0,on=sel.includes(i);return '<span class="pr2 k-'+p[1]+(on?' on':'')+(c[i]===0?' zero':'')+(f?' fold':'')+'" title="'+p[0]+'"><span class="ck">✓</span><span class="d c-'+p[1]+'"></span><span class="nm">'+p[0]+'</span><span class="ab" style="color:'+TXT[p[1]]+'">'+p[2]+'</span><b>'+c[i]+'</b>'+(f?'<i>свёрнуты</i>':'')+(nw&&nw[i]?'<em class="nw">+'+nw[i]+'</em>':'')+'</span>'}).join('')+'</div>'}
function qh(st,pr,bell){return '<div class="qh"><span class="title">Очередь</span>'+st+'<span class="sep"></span>'+pr+'<span class="sp1"></span><div class="qt"><span>▦<span class="tx"> Выделить</span> ▾</span><span class="off" style="color:#aaa">Снять</span><span class="bell">🔔'+(bell?'<i>'+bell+'</i>':'')+'</span></div></div>'}
function tb(){return '<div class="tb"><div class="srch">Поиск по площадке, типу, ID…</div><span class="dd ty">Все типы устройств ▾</span><span class="dd ty">Все типы событий ▾</span><span class="dd ty">Все сценарии ▾</span><span class="dd ty">Приоритет, внутри — старые выше ▾</span><span class="dd fb">⚙ Фильтры</span></div>'}

const pri=(i)=>'<span style="color:'+TXT[PRI[i][1]]+'">'+PRI[i][0]+'</span>';
