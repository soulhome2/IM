# Маршруты модуля «Менеджер инцидентов» в шлюзе облака. @HOST@ — адрес машины из Docker.
# Порты здесь должны совпадать с IM_SERVER_PORT и IM_VITE_PORT в im.env.
        location /api/v1/im-backend/ {
            proxy_pass http://@HOST@:5000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
        location /im/ {
            proxy_pass http://@HOST@:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade_dev;
            proxy_set_header Host localhost:5173;
            proxy_read_timeout 1h;
            expires off;
            add_header Cache-Control "no-cache";
        }
        location /im/operator/ {
            proxy_pass http://@HOST@:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade_dev;
            proxy_set_header Host localhost:5173;
            proxy_read_timeout 1h;
            expires off;
            add_header Cache-Control "no-cache";
            # без этой строки /im/operator без слэша уводит на http://axxonnet.test:8082 (чужой origin)
            absolute_redirect off;
        }
