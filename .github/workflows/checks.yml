# Проверки на каждый push: самопроверка прототипа, тесты API (и по сети, через петлю), целостность машины
# состояний и машины сценариев, «правила только в машине» (мутации машины), мутации кода, ссылки в документах, названия в руководстве оператора
# и экран прототипа (пустой текст, контраст, ширина).
# Результат — во вкладке Actions на GitHub. Красный значок у коммита значит,
# что что-то сломалось; подробности — в журнале шага.
# Мутации — отдельными задачами, они идут одновременно с основной: мутации кода разложены на 4 части
# (матрица, --shard), внутри задачи мутации идут в несколько потоков (tools/parallel.py).
name: checks

on:
  push:
  workflow_dispatch:

jobs:
  checks:
    # Версия закреплена: ubuntu-latest с 19 октября 2026 станет Ubuntu 26, переход — осознанно
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Самопроверка прототипа
        if: always()
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --no-first-run \
            --virtual-time-budget=60000 \
            --dump-dom "file://$PWD/prototype/index.html?selftest" > selftest.html
          python3 - <<'EOF'
          import html, re, sys
          page = open("selftest.html", encoding="utf-8").read()
          log = re.search(r'<pre id="selftest-log"[^>]*>(.*?)</pre>', page, re.S)
          print(html.unescape(log.group(1)) if log else "Отчёт самопроверки не найден")
          sys.exit(0 if 'data-selftest="pass"' in page else 1)
          EOF

      - name: Тесты API
        if: always()
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --no-first-run \
            --virtual-time-budget=120000 \
            --dump-dom "file://$PWD/tests/api.html" > apitest.html
          python3 - <<'EOF'
          import html, re, sys
          page = open("apitest.html", encoding="utf-8").read()
          log = re.search(r'<pre id="apitest-log">(.*?)</pre>', page, re.S)
          print(html.unescape(log.group(1)) if log else "Отчёт тестов API не найден")
          sys.exit(0 if 'data-apitest="pass"' in page else 1)
          EOF

      - name: Тесты API по сети (петля)
        if: always()
        run: python3 tools/check_loopback.py

      - name: Машина состояний
        if: always()
        run: |
          python3 tools/check_machine.py
          python3 tools/build_workflow.py --check

      - name: Машина сценариев — схема, смысл, стык
        if: always()
        # Системный Python в Ubuntu 24.04 закрыт для pip (PEP 668): пакет — в каталог пользователя
        run: |
          python3 -m pip install --quiet --user --break-system-packages jsonschema==4.19.2
          python3 tools/check_scenarios.py

      - name: Машина сценариев — тесты исполнителя
        if: always()
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --no-first-run \
            --virtual-time-budget=20000 \
            --dump-dom "file://$PWD/tests/scenario.html" > scenariotest.html
          python3 - <<'EOF'
          import html, re, sys
          page = open("scenariotest.html", encoding="utf-8").read()
          log = re.search(r'<pre id="scenariotest-log">(.*?)</pre>', page, re.S)
          print(html.unescape(log.group(1)) if log else "Отчёт тестов исполнителя сценариев не найден")
          sys.exit(0 if 'data-scenariotest="pass"' in page else 1)
          EOF

      - name: Словари перевода
        if: always()
        run: python3 tools/check_i18n.py

      - name: Ссылки в документах
        if: always()
        run: python3 tools/check_links.py

      - name: Руководство оператора — названия с экрана
        if: always()
        run: python3 tools/check_guide.py

      - name: Экран — пустой текст, контраст, ширина, ключи и клавиши
        if: always()
        run: python3 tools/check_ui.py

  machine-mutations:
    name: Правила только в машине
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Мутации машины меняют поведение прототипа
        run: python3 tools/check_mutations.py

  code-mutations:
    name: Мутации кода — часть ${{ matrix.shard }} из 4
    runs-on: ubuntu-24.04
    strategy:
      # Упавшая часть не останавливает остальные: видны все выжившие мутации сразу
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - name: Тесты ловят порчу кода
        run: python3 tools/check_code_mutations.py --shard=${{ matrix.shard }}/4
